kind = "web"
previewPath = "/"
title = "StatChasers NFL Depth Charts"
version = "1.0.0"
id = "artifacts/stat-chasers"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22582

[services.development]
run = "pnpm --filter @workspace/stat-chasers run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/stat-chasers", "run", "build" ]
publicDir = "artifacts/stat-chasers/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22582"
BASE_PATH = "/"
